# ---------------------------------------------------------------------------
# FILE: .github/dependabot.yml
# PURPOSE (plain English):
#   Keeps the SHA-pinned GitHub Actions in .github/workflows/ current. On
#   Sunday night Dependabot proposes a single pull request that bumps the pins
#   it finds, so the pins do not silently age into unpatched versions.
#
#   Docker base image proposals also require the normal PR checks and owner merge.
#   Review generated Compose outputs and pins written as environment defaults separately.
# ---------------------------------------------------------------------------
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "22:00"
      timezone: "America/New_York"
    # Wait a week after a version is published before proposing it, so a
    # malicious or broken release has time to be yanked. Semgrep's
    # dependabot-missing-cooldown rule requires this.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directories:
      - "/auth"
      - "/caddy"
      - "/hermes"
      - "/openhands/agent-server"
      - "/status"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
