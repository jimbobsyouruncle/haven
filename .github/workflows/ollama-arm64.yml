name: Ollama ARM64 qualification
on:
  pull_request:
    branches: [main]
    paths:
      - 'docker-compose.yml*'
      - 'tests/qualification/ollama.sh'
      - '.github/workflows/ollama-arm64.yml'

permissions:
  contents: read

jobs:
  ollama:
    name: Ollama API and model-store round trip on ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: test "$(uname -m)" = aarch64 && bash tests/qualification/ollama.sh
