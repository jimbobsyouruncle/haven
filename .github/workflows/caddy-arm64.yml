name: Caddy ARM64 qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'caddy/**'
      - 'scripts/install-root.py'
      - 'scripts/prune-docker-cache.sh'
      - '.github/workflows/caddy-arm64.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build and run Caddy on ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the DNS image and check both modules
        shell: bash
        run: |
          test "$(uname -m)" = aarch64
          docker build --tag haven-caddy:arm64-test ./caddy
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' haven-caddy:arm64-test)" = linux/arm64

          probe=(docker run --rm --network none --read-only --cap-drop ALL
                 --cap-add NET_BIND_SERVICE --security-opt no-new-privileges
                 --entrypoint /usr/bin/caddy haven-caddy:arm64-test)
          version="$("${probe[@]}" version)"
          expected="$(sed -n 's/^ARG CADDY_VERSION=//p' caddy/Dockerfile)"
          test -n "$expected"
          test "${version%% *}" = "v$expected"
          printf '%s\n' "$version"
          modules="$("${probe[@]}" list-modules)"
          grep -Fx 'dns.providers.cloudflare' <<< "$modules"
          grep -Fx 'dns.providers.rfc2136' <<< "$modules"

      - name: Verify Caddy recovery after tag movement and cache cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          scratch="$(mktemp -d)"
          container=''
          cleanup() {
            if [[ -n "$container" ]]; then
              docker container rm -fv "$container" >/dev/null
            fi
            rm -rf -- "$scratch"
          }
          trap cleanup EXIT
          docker version --format 'Docker server {{.Server.Version}}'
          tag=haven-caddy:arm64-test
          container="$(docker run -d --pull never --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint /bin/sleep "$tag" 300)"
          running="$(docker container inspect --format '{{.Image}}' "$container")"
          docker image inspect --format '{{json .}}' "$running" > "$scratch/inspect.json"
          docker image save --output "$scratch/proxy.tar" "$running"
          sha256sum "$scratch/proxy.tar" > "$scratch/proxy.sha256"
          verify_archive() {
            python3 - "$scratch/proxy.tar" "$1" <<'PY'
          import json
          from pathlib import Path
          import runpy
          import sys

          transaction = runpy.run_path('scripts/install-root.py')['Transaction']
          metadata = json.loads(Path(sys.argv[2]).read_text())
          print(transaction.verify_archive(sys.argv[1], metadata))
          PY
          }
          config="$(verify_archive "$scratch/inspect.json")"

          mkdir "$scratch/build"
          printf 'FROM scratch\nCOPY fixture /fixture\n' > "$scratch/build/Dockerfile"
          printf 'replacement tag fixture\n' > "$scratch/build/fixture"
          docker build --tag "$tag" "$scratch/build"
          replacement="$(docker image inspect --format '{{.Id}}' "$tag")"
          test "$replacement" != "$running"
          HAVEN_BUILD_CACHE_CAP=1GB bash scripts/prune-docker-cache.sh
          test "$(docker container inspect --format '{{.Image}} {{.State.Running}}' "$container")" = "$running true"
          sha256sum --check "$scratch/proxy.sha256"

          # Only the disposable fixture is removed and reloaded. A production
          # routine-deploy refusal still requires separate operator approval.
          docker container stop --time 1 "$container" >/dev/null
          docker container rm -v "$container" >/dev/null
          container=''
          if docker image inspect "$running" >/dev/null 2>&1; then
            docker image rm "$running"
          fi
          if docker image inspect "$config" >/dev/null 2>&1; then
            docker image rm "$config"
          fi
          docker image load --input "$scratch/proxy.tar"
          docker image inspect --format '{{json .}}' "$config" > "$scratch/restored.json"
          test "$(verify_archive "$scratch/restored.json")" = "$config"
          test "$(docker image inspect --format '{{.Id}}' "$tag")" = "$replacement"
