name: Status ARM64 qualification
on:
  pull_request:
    branches: [main]
    paths:
      - 'status/**'
      - 'docker-compose.yml*'
      - '.github/workflows/status-arm64.yml'

permissions:
  contents: read

jobs:
  status:
    name: Patched status image and health on ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and exercise mounted status app
        run: |
          test "$(uname -m)" = aarch64
          docker build --tag haven-status:qualification ./status
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' haven-status:qualification)" = linux/arm64
          docker run --rm --network none haven-status:qualification sh -ec '
            version="$(dpkg-query -W -f=\${Version} zlib1g)"
            printf "%s\n" "$version"
            dpkg --compare-versions "$version" ge "1:1.3.dfsg+really1.3.1-1+deb13u1"
          '
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 1000:999 --memory 256m --cpus .5 \
            --tmpfs /tmp:size=16m,mode=1777 \
            -e STATUS_BACKUP_SOCKET=/tmp/backup.sock -e PYTHONDONTWRITEBYTECODE=1 \
            --mount "type=bind,source=$PWD/status/app.py,target=/app/app.py,readonly" \
            haven-status:qualification sh -ec '
              python -u /app/app.py &
              python - << "PYCODE"
          import time
          from urllib.request import urlopen

          for _ in range(30):
              try:
                  with urlopen("http://127.0.0.1:8088/status/healthz", timeout=1) as response:
                      assert response.status == 200 and response.read() == b"ok"
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("status health check timed out")
          PYCODE
          '
