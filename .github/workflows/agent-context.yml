name: Agent context

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  agent-context:
    name: Check agent context maps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: PR checkout ${{ github.event.pull_request.number }} ${{ github.event.pull_request.base.sha }} ${{ github.sha }}
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"

      - name: Check out the generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jimbobsyouruncle/shared-actions
          ref: 3156ad16725e149a9baebeb71862a8d1d341418c
          path: .shared-actions

      - name: Test the freshness check
        run: bash scripts/test-check-agent-context.sh .shared-actions/agent-context/generate.py

      - name: Check the maps are fresh
        run: bash scripts/check-agent-context.sh .shared-actions/agent-context/generate.py
